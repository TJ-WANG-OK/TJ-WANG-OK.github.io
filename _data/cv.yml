cv:
  name: Tengjiao Wang
  label: Research Scientist and Technical Expert
  email: wangtengjiao@outlook.com
  location: Shanghai, China
  image: ""
  summary: Tengjiao Wang is a Research Scientist and Technical Expert with the Wireless Network Research Department at Huawei Technologies Co., Ltd., China. He received his B.S. and Ph.D. degrees from Tsinghua University, Beijing, China, and was a Visiting Scholar at the Massachusetts Institute of Technology (MIT), Cambridge, MA, USA. Currently, he is leading the research of Artificial Intelligence for Radio Access Network (AI4RAN), Electromagnetic Signal and Information Theory (ESIT), and Near Field Communications in 5G-Advanced (5G-A) and 6G wireless communications in Huawei. He actively contributes to academic research, industrial innovation, and standardization of emerging communication technologies. He has authored and co-authored more than 30 peer-reviewed publications in leading journals and international conferences, and has filed more than 30 international patents. He currently serves as the Industry Liaison Officer of the IEEE Communications Society Electromagnetic Signal and Information Theory (ESIT) Emerging Technology Initiative (ETI), promoting collaboration between academia and industry in emerging communication technologies.

