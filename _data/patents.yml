    abstract: "The present application provides a power control method and a related product. The method comprises: a terminal device sends first information to a network device, wherein the first information indicates grouping information and at least one first power difference between the X antenna port groups, and the grouping information is used for indicating that N antenna ports are classified into the X antenna port groups; the network device sends second information to the terminal device, wherein the second information indicates at least one power control parameter of the X antenna port groups, and the second information is obtained on the basis of the first information; and the terminal device sends a reference signal to the network device at the N antenna ports, wherein the transmission power of the reference signal at the N antenna ports is determined on the basis of the power control parameter of the X antenna port groups. By using the solution of the present application, the transmission power of a reference signal is determined on the basis of antenna port groups, so that the transmission power can be reasonably configured, and the channel accuracies measured by a network device on different antenna ports are basically consistent, thereby improving the overall channel measurement accuracy."
