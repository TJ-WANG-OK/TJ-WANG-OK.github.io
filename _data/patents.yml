    abstract: "The present application provides a beam management method and a communication device, capable of improving the transmission efficiency and applicable to a first communication device in a communication system. Polarization directions of the first communication device include three polarization directions. The beam management method comprises: on the basis of a first polarization direction, the first communication device determines a first receive beam corresponding to the first polarization direction and a first pointing angle; and the first communication device receives a first reference signal on each receive beam among receive beams respectively corresponding to the three polarization directions at the first pointing angle, and determines a second receive beam for receiving data. The first reference signal is transmitted by a second communication device on the basis of a first transmit beam. The second receive beam corresponds to the first pointing angle and a second polarization direction, the second polarization direction is one polarization direction among the three polarization directions, and the first receive beam is a receive beam, in a first receive beam set, which has received the first reference signal with maximum signal strength."
