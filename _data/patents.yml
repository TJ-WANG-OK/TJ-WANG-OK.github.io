    abstract: "The present application provides a communication method and a related apparatus. In the method, a terminal device sends first information to a network device. The first information is used for indicating a first basis vector set in a first codebook, and the first basis vector set comprises at least one basis vector. The terminal device receives first indication information and second indication information from the network device. The first indication information is used for indicating oversampling on the distance domain, and the second indication information is used for indicating a first spatial domain range. The terminal device sends third information to the network device, the third information being used for indicating a second basis vector set in a second codebook, and the second basis vector set comprises at least one basis vector. The second codebook is a codebook obtained by means of oversampling in the first spatial domain range, and the density of the basis vectors of the second codebook within the first spatial domain range is greater than the density of the basis vectors in the first codebook within the first spatial domain range. By using the method in the present application, the accuracy of basis vectors can be improved and communication quality can be enhanced while reducing resource overhead."
