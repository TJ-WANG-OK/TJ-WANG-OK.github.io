    abstract: "The present application provides a resource configuration method and a related product. The method comprises: a network device acquires first information, wherein the first information indicates the capability of a terminal device to process channel state information; and on the basis of the first information, the network device sends N·Q reference signals on N·Q reference signal resources, wherein the number of corresponding processing units required when processing the N·Q reference signal resources is as shown in formula (1), formula (1) is associated with Q, Q reference signal resources correspond to P ports, Q>1, and N is a positive integer. By means of the solution of the present application, on the basis of the capability of a terminal device to process channel state information, a network device can accurately determine the number of corresponding processing units required when processing N·Q reference signal resources, such that reference signals are transmitted on reasonable reference signal resources, enabling the terminal device to be capable of processing the received reference signals."
