    abstract: "Disclosed in embodiments of the present application are a communication method and a related apparatus, which are applied to the field of communications. The method is applied to a first communication apparatus, and comprises: receiving first information, wherein the first information indicates a first beam, and an energy concentration range of the first beam is a first range; sending second information, wherein the second information is used for instructing a second communication apparatus to determine a second range; sending multiple second beams on the basis of the first beam; receiving third information, wherein the third information indicates the second range, the second range is determined by the second communication apparatus on the basis of the multiple second beams, and the second range is larger than the first range; and determining a third beam on the basis of the third information, wherein an energy concentration range of the third beam is the second range, and the third beam is used for communication between the first communication apparatus and the second communication apparatus. By adjusting energy concentration ranges of beams and improving the robustness of near-field beams, frequent triggering of a beam recovery process is avoided, thereby reducing the overhead of beam management."
