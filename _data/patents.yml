    abstract: "Provided in the present application are a communication method and apparatus. The method comprises: determining a first resource set, wherein the first resource set comprises K resource groups, each of the K resource groups comprises Q resources, each of the Q resources corresponds to N ports, and the Q resources correspond to P ports, K being a positive integer, Q being a positive integer greater than 1, P being greater than N, P being a positive integer greater than 32, and N being a positive integer greater than 1; receiving first indication information, wherein the first indication information is used for indicating a slot corresponding to each resource among (Q*K) resources; and on the basis of the slot corresponding to each resource, measuring each resource to determine channel state information (CSI). By using the present application, the spectral efficiency and the system capacity can be improved."
